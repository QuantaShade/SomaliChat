{%extends 'app/_base.html'%}
{%block content%}

<section class="w-full h-screen p-4 mt-12">
    <form method="POST" class="p-4 flex flex-col gap-3">
        {%csrf_token%}
        {%for f in form%}
        <label>{{f.label}}</label>
        {{f}}
        {%if f.errors%}
        <p class="text-red-500 font-bold">
            {{f.errors.0}}
        </p>
        {%endif%}
        {%endfor%}
    <button class="btn btn-primary" type="submit">Submit</button>
    </form>
</section>

{%endblock%}
