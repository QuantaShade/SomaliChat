{% extends 'app/_base.html' %}

{% block content %}

<!-- HERO SECTION -->
<section class="w-full text-center mt-32">
    <h1 class="text-4xl font-bold">
        Welcome to <span class="text-red-500">SomaliChat</span>
    </h1>
    <p class="text-gray-600 mt-3">
        Share posts, connect with people, and explore content.
    </p>
</section>

<div class="flex justify-end cursor-pointer"><div class="mr-6"><a href="{% url 'createContent' %}" class="btn btn-primary" type="submit">Post</a></div></div>
<!-- POSTS FEED -->
<main class="w-full mx-auto px-4 py-8 space-y-6 grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">

    {% for c in data %}

    <!-- POST CARD -->
    <div class="rounded-xl overflow-hidden shadow-sm">

        <!-- Image -->
        <a href="{%url 'viewContent' c.id%}">
            <img src="{{ c.img }}"
            class="w-full object-cover"
            alt="{{ c.title }}">
        </a>
        
        <!-- Post Header -->
        <div class="flex items-center justify-between p-3">
            <div class="font-semibold text-black">
                {{ c.title }}
            </div>
            <span class="text-xs text-gray-500">{{ c.postedAt }}</span>
        </div>

        <!-- Actions -->
        <div class="flex justify-between px-4 py-3 text-sm text-gray-600">

            <div class="flex gap-4">

                <!-- Like -->
                <button class="flex items-center gap-1 hover:text-red-500">
                    ❤️ Like
                </button>
                
                <!-- Comment -->
                <button class="hover:text-black">
                    💬 Comment
                </button>

                <!-- Share -->
                <button class="hover:text-black">
                    🔄 Share
                </button>

            </div>
        </div>
        <!-- Save -->
        <a href="{%url 'deleteContent' c.id %}" class="flex p-2">
            <button class="w-full btn text-white bg-red-500 hover:bg-red-600 duration-200 P-4">
                Delete
            </button>
        </a>
        <a href="{%url 'editContent' c.id %}" class="flex p-2">
            <button class="w-full btn text-white bg-yellow-500 hover:bg-yellow-600 duration-200 P-4">
                Edit
            </button>
        </a>

    </div>

    {% endfor %}

</main>

{% endblock %}
